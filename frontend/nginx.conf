server {
    listen 80;
    server_name pm.energi-up.com localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cache control for static assets (images, fonts)
    # Exclude favicon files from long-term caching during development
    # Never serve configs, scripts or notes that sit in the web root (the folder is
    # bind-mounted from the server, so /nginx.conf.production etc. were downloadable).
    location ~* (^/nginx|^/Dockerfile|^/start-nginx|\.md$|\.sh$|\.conf$) {
        return 404;
    }

    location ~* \.(jpg|jpeg|png|gif|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # No cache for favicon files to allow updates
    location ~* (favicon|apple-touch-icon|android-chrome)\.(ico|png)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # No cache for JS and CSS files during development
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # No cache for HTML files
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Uploads: ERP CR documents can be up to 30 MB (ERP CR sync API); PM screens allow 10 MB.
    # (nginx's default is 1 MB.)
    client_max_body_size 31M;

    # Proxy API requests to backend
    # Using private IP for internal VPC communication (faster and more reliable)
    # Alternative: Use public IP http://8.215.56.98:1819 if NAT Gateway DNAT is configured
    location /api/ {
        proxy_pass http://172.28.80.51:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # Increase timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }


    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # SPA routing - serve index.html for all non-API routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}

